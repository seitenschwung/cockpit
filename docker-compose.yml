# Not deployed any more: the cockpit runs on the home server (see README.md). This file only keeps
# the hardened container settings and CrowdSec labels; CI still builds and tests the Dockerfile image.
services:
  web:
    image: ${IMAGE:-ghcr.io/seitenschwung/image-set-by-ci:none}
    restart: unless-stopped
    # CrowdSec reads this container's logs through the Docker API (labels, see CLAUDE.md).
    labels:
      - crowdsec.enable=true
      - crowdsec.labels.type=nginx
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8090:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
