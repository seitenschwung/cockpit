<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Cockpit</title>
  <meta name="description" content="Zustand aller Projekt-Boxen, Repos und Seiten auf dem Home-Server.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top" id="top" data-level="unknown">
    <div class="wrap">
      <div class="bar">
        <span class="brand"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M2 12h4l3-8 4 16 3-8h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Cockpit</span>
        <p class="age"><span class="live" aria-hidden="true"></span><span id="age"></span></p>
      </div>
      <div class="hero">
        <div class="verdict">
          <h1 id="verdict">Lade …</h1>
          <p class="sub" id="sub"></p>
        </div>
        <div class="donut" id="donut" role="img" aria-label="Verteilung der Zustände"></div>
        <ul class="stats" id="stats" aria-label="Kennzahlen"></ul>
      </div>
      <p class="notice" id="notice" role="alert" hidden></p>
    </div>
  </header>

  <main class="wrap">
    <section aria-labelledby="h-projects">
      <h2 id="h-projects">Projekte</h2>
      <div class="cards" id="cards"></div>
    </section>

    <section aria-labelledby="h-host">
      <h2 id="h-host">Host</h2>
      <ul class="host" id="host"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
