<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Cockpit</title>
  <meta name="description" content="Zustand aller Projekt-Boxen, Repos und Seiten auf dem Home-Server.">
  <link rel="icon" id="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell top" id="top" data-level="unknown">
  <aside class="side">
    <span class="brand"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M2 12h4l3-8 4 16 3-8h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Cockpit</span>
    <nav id="nav" aria-label="Bereiche">
      <button type="button" data-pg="overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6V11h-6zM4 20h6v-4H4zM14 4v3h6V4z"/></svg>Übersicht</button>
      <button type="button" data-pg="projects"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Projekte</button>
      <button type="button" data-pg="prs"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V10a3 3 0 0 0-3-3h-3"/><path d="m14 4-3 3 3 3"/></svg>Pull Requests <span class="navn" id="prcount"></span></button>
      <button type="button" data-pg="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Statistik</button>
      <button type="button" data-pg="system"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/><path d="M7 7h.01M7 17h.01"/></svg>System</button>
    </nav>
    <div class="prefs">
      <div class="seg" id="theme" role="group" aria-label="Farbschema">
        <button type="button" data-theme="auto">Auto</button>
        <button type="button" data-theme="light">Hell</button>
        <button type="button" data-theme="dark">Dunkel</button>
      </div>
      <div class="seg" id="density" role="group" aria-label="Dichte">
        <button type="button" data-density="normal">Normal</button>
        <button type="button" data-density="compact">Kompakt</button>
      </div>
    </div>
    <p class="age"><span class="live" aria-hidden="true"></span><span id="age"></span></p>
  </aside>

  <div class="content">
  <p class="notice" id="notice" role="alert" hidden></p>

  <main>
    <section class="page" data-page="overview" aria-label="Übersicht">
      <div class="hero">
        <div class="verdict">
          <h1 id="verdict">Lade …</h1>
          <p class="sub" id="sub"></p>
        </div>
        <div class="donut" id="donut" role="img" aria-label="Verteilung der Zustände"></div>
        <ul class="stats" id="stats" aria-label="Kennzahlen"></ul>
      </div>
      <section class="todo" aria-labelledby="h-todo">
        <h2 id="h-todo">Was muss ich tun?</h2>
        <ul id="todo"></ul>
      </section>
    </section>

    <section class="page" data-page="stats" aria-labelledby="h-insights">
      <h1 class="pagetitle" id="h-insights">Statistik</h1>
      <div class="charts">
        <article class="panel wide" aria-labelledby="h-tokens">
          <header>
            <h2 id="h-tokens">Tokenverbrauch pro Tag</h2>
            <div class="ctrls">
              <div class="seg" id="metric" role="group" aria-label="Messgröße">
                <button type="button" data-metric="out">Output</button>
                <button type="button" data-metric="cache">Cache</button>
                <button type="button" data-metric="turns">Turns</button>
              </div>
              <div class="seg" id="range" role="group" aria-label="Zeitraum">
                <button type="button" data-range="3">3 Tage</button>
                <button type="button" data-range="7">7 Tage</button>
              </div>
            </div>
          </header>
          <p class="panel-sub" id="tokens-sub"></p>
          <div class="chart" id="chart-tokens"></div>
          <div class="legend" id="legend" role="group" aria-label="Projekte ein- oder ausblenden"></div>
        </article>
        <article class="panel" aria-labelledby="h-res">
          <header>
            <h2 id="h-res">Ressourcen</h2>
            <div class="seg" id="resmetric" role="group" aria-label="Messgröße">
              <button type="button" data-res="ram">RAM</button>
              <button type="button" data-res="cpu">CPU</button>
            </div>
          </header>
          <p class="panel-sub">Klick springt zur Karte</p>
          <ul class="bars" id="chart-res"></ul>
        </article>
        <article class="panel" aria-labelledby="h-egress">
          <header><h2 id="h-egress">Egress, letzte Stunde</h2></header>
          <p class="panel-sub">Anfragen pro Box, blockierte rot markiert</p>
          <ul class="bars eg" id="chart-egress"></ul>
        </article>
      </div>
    </section>

    <section class="page" data-page="projects" aria-labelledby="h-projects">
      <div class="section-head">
        <h1 class="pagetitle" id="h-projects">Projekte</h1>
        <div class="tools">
          <input type="search" id="q" placeholder="Suchen ( / )" aria-label="Projekte suchen" autocomplete="off">
          <div class="seg" id="view" role="group" aria-label="Ansicht">
            <button type="button" data-view="cards">Karten</button>
            <button type="button" data-view="table">Tabelle</button>
          </div>
          <label>Sortieren <select id="sort">
            <option value="status">Status (Probleme zuerst)</option>
            <option value="name">Name</option>
            <option value="claude">Claude-Aktivität</option>
            <option value="tokens">Tokens heute</option>
            <option value="ram">RAM</option>
            <option value="cpu">CPU</option>
          </select></label>
          <button type="button" id="expand">Alle auf</button>
          <button type="button" id="collapse">Alle zu</button>
        </div>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter"></div>
      <p class="count" id="count" aria-live="polite"></p>
      <div class="cards" id="cards"></div>
      <div class="tablewrap" id="table" hidden></div>
    </section>

    <section class="page" data-page="project" aria-label="Projekt">
      <div id="detail"></div>
    </section>

    <section class="page" data-page="prs" aria-labelledby="h-prs">
      <h1 class="pagetitle" id="h-prs">Pull Requests</h1>
      <p class="count" id="prsub"></p>
      <div class="tablewrap" id="prs"></div>
    </section>

    <section class="page" data-page="system" aria-labelledby="h-host">
      <h1 class="pagetitle" id="h-host">System</h1>
      <ul class="host" id="host"></ul>
    </section>
  </main>
  </div>
  </div>

  <script src="app.js"></script>
  <script src="charts.js"></script>
  <script src="detail.js"></script>
</body>
</html>
