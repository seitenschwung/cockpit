<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Cockpit</title>
  <meta name="description" content="Zustand aller Projekt-Boxen, Repos und Seiten auf dem Home-Server.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top" id="top" data-level="unknown">
    <div class="wrap top-inner">
      <div class="verdict">
        <span class="dot" aria-hidden="true"></span>
        <h1 id="verdict">Lade …</h1>
      </div>
      <ul class="stats" id="stats" aria-label="Kennzahlen"></ul>
      <p class="age" id="age" aria-live="off"></p>
    </div>
    <div class="wrap"><p class="notice" id="notice" role="alert" hidden></p></div>
  </header>

  <main class="wrap">
    <section aria-labelledby="h-projects">
      <h2 id="h-projects">Projekte</h2>
      <div class="cards" id="cards"></div>
    </section>

    <section aria-labelledby="h-host">
      <h2 id="h-host">Host</h2>
      <ul class="host" id="host"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
